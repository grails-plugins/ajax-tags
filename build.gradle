buildscript {
    repositories {
        maven { url 'https://repo.grails.org/grails/core' }
        mavenCentral()
    }
    dependencies {
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath 'org.apache.grails:grails-gradle-plugins'
        classpath 'org.apache.grails.gradle:grails-publish'
    }
}

plugins {
    id 'groovy'
}

apply plugin: 'org.apache.grails.gradle.grails-plugin'
apply plugin: 'org.apache.grails.gradle.grails-gsp'
apply plugin: 'org.apache.grails.gradle.grails-publish'

version project.projectVersion
group 'org.grails.plugins'

repositories {
    maven { url 'https://repo.grails.org/grails/core' }
    mavenCentral()
}

dependencies {
    compileOnly platform("org.apache.grails:grails-bom:$grailsVersion")
    compileOnly 'org.apache.grails:grails-dependencies-starter-web'

    console 'org.apache.grails:grails-console'

    testImplementation platform("org.apache.grails:grails-bom:$grailsVersion")
    testImplementation 'org.apache.grails:grails-testing-support-web'
    testImplementation 'org.spockframework:spock-core'
    testRuntimeOnly 'net.bytebuddy:byte-buddy'
}

grails {
    springDependencyManagement = false
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion.toInteger())
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(Javadoc).configureEach {
    options.noTimestamp true // prevent the file header with the date
    options.bottom "Version: ${projectVersion}"
}

tasks.withType(GroovyCompile).configureEach {
    // encoding needs to be the same since it's different across platforms
    groovyOptions.encoding = 'UTF-8'
    options.encoding = 'UTF-8'
    // Preserve method parameter names in Groovy classes for IDE parameter hints.
    groovyOptions.parameters = true
    options.fork = true
    options.forkOptions.jvmArgs = ['-Xms128M', '-Xmx1G']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    testLogging {
        exceptionFormat = 'full'
        events 'passed', 'skipped', 'failed'
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false // to prevent timestamp mismatches
    reproducibleFileOrder = true // to keep the same ordering
    // to avoid platform specific defaults, set the permissions consistently
    filePermissions { permissions ->
        permissions.unix(0644)
    }
    dirPermissions { permissions ->
        permissions.unix(0755)
    }
}

grailsPublish {
    githubSlug = 'grails-plugins/ajax-tags'
    license {
        name = 'Apache-2.0'
    }
    title = 'Grails Ajax Tags Plugin'
    desc = 'The ajax-tags plugin provides AJAX related GSP tags.'
    developers = [osscontributor: 'Jeff Brown']
}
